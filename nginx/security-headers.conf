# Shared by nginx.conf. nginx does NOT merge `add_header` directives across
# nesting levels: a `location` block that declares its own `add_header`
# (e.g. for Cache-Control) silently loses every add_header inherited from
# its enclosing `server` block. Any such location block must `include` this
# file too, or these three headers disappear from its responses (SEC-1,
# docs/superpowers/specs/2026-07-12-security-audit-findings.md).
#
# `always` makes each header apply to error responses (4xx/5xx) too, not
# just the 2xx/3xx codes add_header covers by default.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
