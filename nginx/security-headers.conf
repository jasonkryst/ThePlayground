# Shared by nginx.conf. nginx does NOT merge `add_header` directives across
# nesting levels: a `location` block that declares its own `add_header`
# (e.g. for Cache-Control) silently loses every add_header inherited from
# its enclosing `server` block. Any such location block must `include` this
# file too, or these three headers disappear from its responses (SEC-1,
# docs/superpowers/specs/2026-07-12-security-audit-findings.md).
#
# `always` makes each header apply to error responses (4xx/5xx) too, not
# just the 2xx/3xx codes add_header covers by default.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy (SEC-2): script-src/connect-src allow the opt-in GA
# loader (src/App.jsx, gated behind sanitizeGaId); style-src needs
# 'unsafe-inline' for the app's legitimate per-item inline style attributes.
# See docs/superpowers/specs/2026-07-18-security-hardening-design.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

# Permissions-Policy (SEC-3): the app uses none of these APIs — deny outright
# as free hardening against any future third-party script.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
