name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for all jobs (issue #145). Only the `trivy` job
# needs more (security-events: write, to upload SARIF) and declares its own
# job-level override below — GitHub Actions job-level `permissions:`
# replaces rather than merges with this workflow-level default, so that
# override is unaffected by this block.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  lint-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:css

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pre-pull nginx image (e2e/nginx-headers.spec.js boots a live container)
        run: docker pull nginxinc/nginx-unprivileged:1.30-alpine
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t playground:ci .

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Allowlists GHSA-qwww-vcr4-c8h2 only (react-router "RSC Mode CSRF
      # Bypass" — this app is a client-only SPA using BrowserRouter, never
      # react-router's RSC/framework mode, so the vulnerable path isn't
      # reachable here). Everything else in the production tree still fails
      # the gate exactly as before. Real fix (removes the need for this
      # allowlist entirely) is tracked in docs/ENHANCEMENTS.md under
      # Security: upgrading to React 19 + react-router 8, which is a bigger
      # change than this gate fix — react-router 8 requires React >=19.2.7.
      #
      # Allowlist entry added: 2026-07-28. This isn't a fix, just a reviewed
      # exception (issue #145) — .github/__tests__/ci.test.js fails once this
      # entry is more than 180 days old, forcing a fresh look rather than
      # letting the exception calcify silently.
      - name: Production dependency audit (gate)
        run: npx audit-ci --moderate --skip-dev --allowlist GHSA-qwww-vcr4-c8h2
      - name: Dev dependency audit (report-only)
        if: always()
        run: |
          npm audit --omit=prod > audit-dev.txt || true
          {
            echo "### npm audit — dev dependencies (report-only, does not fail CI)"
            echo '```'
            cat audit-dev.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t playground:ci .
      - name: Vulnerability gate (fixable CRITICAL/HIGH findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: playground:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Full vulnerability report (all severities, including unfixed)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: playground:ci
          format: sarif
          output: trivy-results.sarif
      - name: Upload scan results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-results.sarif

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # ubuntu-latest stopped guaranteeing a pre-installed Chrome that
      # lhci's chrome-launcher can auto-detect (broke between PR #138 and
      # #139, 2026-07-26/27, with no app-code change in between) — install
      # one explicitly instead of relying on the runner image's contents.
      - name: Set up Chrome for Lighthouse CI
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
