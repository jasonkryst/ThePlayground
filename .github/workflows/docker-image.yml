name: Docker Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  docker-release:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: jasonkryst/playground
      VERSION_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version and tags
        id: vars
        shell: bash
        run: |
          TAG="${VERSION_TAG}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/playground"

          if [[ "${VERSION}" == *"-"* ]]; then
            IS_LATEST="false"
          else
            IS_LATEST="true"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Built once, locally, so it can be Trivy-scanned before anything is
      # pushed (issue #145) — previously this image was built twice more by
      # docker/build-push-action below and pushed straight from the build,
      # so the artifact that reached the registry was never itself scanned
      # (ci.yml's `trivy` job only scans a same-commit proxy build).
      - name: Build release image (local, for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: playground:release

      - name: Vulnerability gate (fixable CRITICAL/HIGH findings) — the exact image about to be pushed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: playground:release
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push version tags
        run: |
          docker tag playground:release "${{ env.DOCKERHUB_IMAGE }}:${{ steps.vars.outputs.version }}"
          docker tag playground:release "${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.version }}"
          docker push "${{ env.DOCKERHUB_IMAGE }}:${{ steps.vars.outputs.version }}"
          docker push "${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.version }}"

      - name: Tag and push latest tag
        if: steps.vars.outputs.is_latest == 'true'
        run: |
          docker tag playground:release "${{ env.DOCKERHUB_IMAGE }}:latest"
          docker tag playground:release "${{ steps.vars.outputs.ghcr_image }}:latest"
          docker push "${{ env.DOCKERHUB_IMAGE }}:latest"
          docker push "${{ steps.vars.outputs.ghcr_image }}:latest"