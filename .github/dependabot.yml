version: 2
updates:
  # Keeps the commit-SHA pins in .github/workflows/*.yml current (issue
  # #145) — SHA-pinning stops a tag being silently repointed, but only if
  # something also updates the pins when the action ships a new version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the Dockerfile's major.minor base-image tags (node:26-alpine,
  # nginxinc/nginx-unprivileged:1.31-alpine) current. npm is deliberately
  # NOT tracked here — production deps are already gated by audit-ci in
  # ci.yml, a separate concern (see .github/__tests__/dependabot.test.js).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Node only ever promotes an even-numbered major to Active LTS (each
      # October, for that year's April release) — odd majors are six-month
      # "Current" releases that never go LTS at all. Dependabot can't tell
      # the difference, so a routine major-bump PR already landed the
      # Dockerfile on a non-LTS release once without anyone noticing until
      # a manual review caught it (node:24-alpine -> node:26-alpine, 1.1.9;
      # issue #193). Major bumps for node now require a deliberate manual
      # PR, opened once the target major has actually reached LTS — minor/
      # patch content within the current major tag still updates silently
      # via Docker Hub with no PR needed either way.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
