version: 2
updates:
  # Keeps the commit-SHA pins in .github/workflows/*.yml current (issue
  # #145) — SHA-pinning stops a tag being silently repointed, but only if
  # something also updates the pins when the action ships a new version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the Dockerfile's major.minor base-image tags (node:24-alpine,
  # nginxinc/nginx-unprivileged:1.30-alpine) current. npm is deliberately
  # NOT tracked here — production deps are already gated by audit-ci in
  # ci.yml, a separate concern (see .github/__tests__/dependabot.test.js).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
